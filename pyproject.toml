[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "openvitals"
version = "0.1.0a1"
description = "Open-source connector layer for consumer health data"
requires-python = ">=3.12"
license = { file = "LICENSE" }
dependencies = [
    # Core schema + validation
    "pydantic>=2.7,<3",
    # HTTP — all connectors use this; declared here so connector authors never touch pyproject
    "httpx>=0.27,<1",
    # Credential encryption
    "cryptography>=42,<51",
]

[tool.hatch.build.targets.wheel]
packages = ["openvitals"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=8,<10",
]
