[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "openvitals"
version = "0.1.0a1"
description = "Open-source connector layer for consumer health data"
requires-python = ">=3.12"
license = { file = "LICENSE" }
dependencies = [
    # Core schema + validation
    "pydantic>=2.7,<3",
    # HTTP — all connectors use this; declared here so connector authors never touch pyproject
    "httpx>=0.27,<1",
    # Credential encryption
    "cryptography>=42,<45",
    # Async support (used by httpx async clients in connectors)
    "anyio>=4,<5",
    # OAuth 2.0 flows (WHOOP, Strava, Withings all need it)
    "authlib>=1.3,<2",
    # Timezone support (IANA zone handling)
    "tzdata>=2024.1",
]

[tool.hatch.build.targets.wheel]
packages = ["openvitals"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=8,<9",
]
